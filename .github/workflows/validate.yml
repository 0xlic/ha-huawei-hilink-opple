name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install cryptography pytest ruff
      - name: Compile
        run: python -m compileall -q custom_components tests tools
      - name: Test protocol helpers
        run: python -m pytest -q
      - name: Lint
        run: ruff check custom_components tests tools
      - name: Validate JSON
        run: |
          python -m json.tool custom_components/huawei_hilink_opple/manifest.json >/dev/null
          python -m json.tool custom_components/huawei_hilink_opple/strings.json >/dev/null
          python -m json.tool custom_components/huawei_hilink_opple/translations/en.json >/dev/null
          python -m json.tool custom_components/huawei_hilink_opple/translations/zh-Hans.json >/dev/null
