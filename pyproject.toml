[project]
name = "ha-huawei-hilink-opple"
version = "0.2.2"
description = "Local Home Assistant control for Huawei HiLink Opple ceiling lights"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
credential-web = ["playwright>=1.46"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
